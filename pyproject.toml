[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnm-node"
version = "1.6.0"
description = "QNM-BUILD-1.0 + AIH-WP-1.3 + QNS-CD-1.0 + FABRIC-MESH-PIPELINE-1.0 ALL-CHANNELS-ON Quantum Node Mesh local node and qnsd signal daemon (photon, vias, APG, AZPIPE). Author: Aziel Eliab."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
  "qnm",
  "quantum-node-mesh",
  "qnm-build",
  "aih-wp",
  "pair-bind",
  "spiderweb",
  "apg",
  "phoenix-lock",
  "receipts",
  "local-first",
  "qnsd",
  "qns-cd",
  "photon",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
qnm-node = "qnm.node:main"
qnsd = "qnsd.api:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/qnm-node"
Issues = "https://github.com/AzielEliab/qnm-node/issues"

[tool.setuptools.packages.find]
include = ["qnm*", "qnsd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
