name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (no hardware)
        run: python -m pytest -q
        env:
          QNM_LOCAL_TOKEN: ""
          QNM_SHELF_KEY: ""
